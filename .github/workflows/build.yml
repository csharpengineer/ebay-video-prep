name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore .\EbayVideoPrep.sln

      - name: Build
        run: dotnet build .\EbayVideoPrep.sln -c Release --no-restore

      - name: Publish Windows x64 build
        run: dotnet publish .\src\EbayVideoPrep\EbayVideoPrep.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o .\artifacts\EbayVideoPrep

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: EbayVideoPrep-win-x64
          path: .\artifacts\EbayVideoPrep\
